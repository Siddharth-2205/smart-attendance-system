services:
  # Node.js backend API
  - type: web
    name: smart-attendance-demo-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24.16.0"

      - key: NODE_ENV
        value: development

      - key: HOST
        value: 0.0.0.0

      # Development registration range for students
      - key: STUDENT_ROSTER_RANGE
        value: "001-300"

      # Allow requests from the deployed frontend
      - key: CORS_ORIGINS
        value: https://smart-attendance-demo-qrmf.onrender.com

      # ENABLE PROFESSOR SELF-REGISTRATION
      - key: ALLOW_SELF_SERVICE_PROFESSOR_REGISTRATION
        value: "true"

      # Face verification service URL
      - key: FACE_SERVICE_URL
        fromService:
          name: smart-attendance-demo-face
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      # Shared authentication token for the face service
      - key: FACE_SERVICE_TOKEN
        fromService:
          name: smart-attendance-demo-face
          type: web
          envVarKey: FACE_SERVICE_TOKEN

  # Face verification service
  - type: web
    name: smart-attendance-demo-face
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./face-liveness/Dockerfile
    dockerContext: ./face-liveness
    healthCheckPath: /health
    envVars:
      - key: FACE_TEMPLATE_KEY
        generateValue: true

      - key: FACE_SERVICE_TOKEN
        generateValue: true

      - key: FACE_DATA_DIR
        value: /var/data

  # React frontend
  - type: web
    name: smart-attendance-demo
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24.16.0"

      - key: VITE_API_URL
        fromService:
          name: smart-attendance-demo-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
