services:
  - type: web
    name: smart-attendance-demo-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: development
      - key: HOST
        value: 0.0.0.0
      - key: STUDENT_ROSTER
        value: "23BCS001,23BCS002,23BCS003,23BCS004,23BCS005"
      - - key: CORS_ORIGINS
        value: https://smart-attendance-demo-qrmf.onrender.com
      - key: ALLOW_SELF_SERVICE_PROFESSOR_REGISTRATION
        value: "false"
      - key: FACE_SERVICE_URL
        fromService:
          name: smart-attendance-demo-face
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FACE_SERVICE_TOKEN
        fromService:
          name: smart-attendance-demo-face
          type: web
          envVarKey: FACE_SERVICE_TOKEN

  - type: web
    name: smart-attendance-demo-face
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./face-liveness/Dockerfile
    dockerContext: ./face-liveness
    healthCheckPath: /health
    envVars:
      - key: FACE_TEMPLATE_KEY
        generateValue: true
      - key: FACE_SERVICE_TOKEN
        generateValue: true
      - key: FACE_DATA_DIR
        value: /var/data

  - type: web
    name: smart-attendance-demo
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: VITE_API_URL
        fromService:
          name: smart-attendance-demo-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
